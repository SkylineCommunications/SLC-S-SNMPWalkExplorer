name: Build Solution

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-**"
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm
        cache-dependency-path: SLC-S-SNMPWalkBrowser/package-lock.json

    - name: Install browser dependencies
      working-directory: SLC-S-SNMPWalkBrowser
      run: npm ci

    - name: Build
      run: dotnet build SLC-S-SNMPWalkExplorer.slnx -c Release --warnaserror

    - name: Test
      run: dotnet test SLC-S-SNMPWalkCollector.Tests/SLC-S-SNMPWalkCollector.Tests.csproj -c Release --no-build
